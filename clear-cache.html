<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache & Reload</title>
</head>
<body>
    <h1>Clearing Cache...</h1>
    <p id="status">Working...</p>
    <script>
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                    console.log('Service Worker unregistered');
                }
            });
        }
        
        // Clear all caches
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                    console.log('Cache deleted:', name);
                }
            });
        }
        
        document.getElementById('status').innerHTML = 
            'Cache cleared!<br><br>' +
            '<a href="index.html?' + Date.now() + '" style="font-size: 20px; padding: 10px 20px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px;">Open App (Fresh)</a>';
    </script>
</body>
</html>
