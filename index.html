            "@type": "EducationalOrganization",

          },
          "educationalLevel": "Intermediate",
          "timeRequired": "P24W"

    <header>
      <div class="header-content">
        <div class="nav-buttons">
          <button id="home-btn" onclick="showHome()">
            <img src="icons/favicon-96x96.png" alt="Courses" class="home-icon">
          </button>
          <button id="back-btn" onclick="goBack()" style="display: none">
            Back
          </button>
        </div>
        <button
          class="theme-toggle theme-toggle-desktop"
          onclick="toggleTheme()"
        >
          🌙
        </button>
      </div>
    </header>

    <div class="container">
      <!-- Home Page -->
      <div id="home-page" class="page active">
        <div class="home-page">
          <h1>Courses</h1>
          <div class="courses-grid" id="courses-grid">
            <!-- Generated by JS -->
          </div>
        </div>
      </div>

      <!-- Contents Page (List of all lessons) -->
      <div id="contents-page" class="page">
        <div id="contents-content" class="contents-detail">
          <!-- Generated by JS -->
        </div>
      </div>

      <!-- Course Page -->
      <div id="course-page" class="page">
        <div id="course-content" class="course-detail">
          <!-- Generated by JS -->
        </div>
      </div>

          <aside id="sidebar" class="sidebar">
            <div id="sidebar-content" class="sidebar-content">

            </div>

          <!-- Main Content -->
          <div class="lesson-main">
            <div id="lesson-header" class="lesson-header">
              <!-- Generated by JS -->
            </div>
            <div id="lesson-content" class="lesson-body">
              <!-- Generated by JS -->
            </div>

            <!-- Interview Questions Section -->
            <div id="interview-section" class="interview-section">
              <h2>Interview Questions</h2>
              <div id="interview-questions" class="accordion">
                <!-- Generated by JS -->
              </div>
            </div>

            <div id="lesson-nav" class="lesson-nav">
              <!-- Generated by JS -->
            </div>
            <div class="progress-bar">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
          </div>
        </div>
      </div>

        </button>

            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <span>Theme</span>
        </button>
      </div>

    <!-- Course Menu Slide-Up Modal -->
    <div
      id="course-menu-overlay"
      class="course-menu-overlay"
      onclick="closeCourseMenu(event)"
    >
      <div class="course-menu-modal" onclick="event.stopPropagation()">
        <div class="course-menu-handle"></div>
        <div class="course-menu-header">
          <h3>Course Contents</h3>
          <button class="course-menu-close" onclick="closeCourseMenu()">
            &times;
          </button>
        </div>
        <div id="course-menu-content" class="course-menu-content">
          <!-- Generated by JS -->
        </div>
      </div>
    </div>

    <script src="theme.js"></script>

    <script src="modules/module0-prerequisites.js"></script>

    <!-- Update Notification Banner -->
    <div
      id="update-banner"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #4caf50;
        color: white;
        padding: 15px;
        text-align: center;
        z-index: 10000;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      "
    >
      <span>New content available! </span>
      <button
        onclick="location.reload()"
        style="
          background: white;
          color: #4caf50;
          border: none;
          padding: 8px 20px;
          margin-left: 10px;
          border-radius: 4px;
          cursor: pointer;
          font-weight: bold;
        "
      >
        Update Now
      </button>
      <button
        onclick="
          document.getElementById('update-banner').style.display = 'none'
        "
        style="
          background: transparent;
          color: white;
          border: 1px solid white;
          padding: 8px 20px;
          margin-left: 10px;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Later
      </button>
    </div>
