<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="nav-buttons">
                <button id="home-btn" onclick="showHome()">Home</button>
                <button id="back-btn" onclick="goBack()" style="display: none;">Back</button>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="container">
        <!-- Home Page -->
        <div id="home-page" class="page active">
            <div class="home-page">
                <h1>Courses</h1>
                <div class="courses-grid" id="courses-grid">
                    <!-- Generated by JS -->
                </div>
            </div>
        </div>

        <!-- Contents Page -->
        <div id="contents-page" class="page">
            <div id="contents-content" class="contents-detail">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Course Page -->
        <div id="course-page" class="page">
            <div id="course-content" class="course-detail">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Lesson Page -->
        <div id="lesson-page" class="page">
            <div class="lesson-layout">
                <aside id="sidebar" class="sidebar">
                    <div id="sidebar-content" class="sidebar-content">
                        <!-- Generated by JS -->
                    </div>
                </aside>

                <div class="lesson-main">
                    <div id="lesson-header" class="lesson-header">
                        <!-- Generated by JS -->
                    </div>
                    <div id="lesson-content" class="lesson-body">
                        <!-- Generated by JS -->
                    </div>

                    <div id="interview-section" class="interview-section">
                        <h2>Interview Questions</h2>
                        <div id="interview-questions" class="accordion">
                            <!-- Generated by JS -->
                        </div>
                    </div>

                    <div id="lesson-nav" class="lesson-nav">
                        <!-- Generated by JS -->
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navbar -->
    <nav id="bottom-navbar" class="bottom-navbar">
        <div class="bottom-navbar-content">
            <button class="bottom-nav-item" onclick="showHome()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9,22 9,12 15,12 15,22"></polyline>
                </svg>
                <span>Home</span>
            </button>
            <button class="bottom-nav-item active" onclick="openCourseMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>Contents</span>
            </button>
            <button class="bottom-nav-item" onclick="toggleTheme()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span>Theme</span>
            </button>
        </div>
    </nav>

    <!-- Course Menu Slide-Up Modal -->
    <div id="course-menu-overlay" class="course-menu-overlay" onclick="closeCourseMenu(event)">
        <div class="course-menu-modal" onclick="event.stopPropagation()">
            <div class="course-menu-handle"></div>
            <div class="course-menu-header">
                <h3>Course Contents</h3>
                <button class="course-menu-close" onclick="closeCourseMenu()">&times;</button>
            </div>
            <div id="course-menu-content" class="course-menu-content">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Load JavaScript files (NO SERVICE WORKER FOR TESTING) -->
    <script src="theme.js"></script>
    <script src="modules/module0-prerequisites.js"></script>
    <script src="modules/module1-foundations.js"></script>
    <script src="modules/module6-message-queues.js"></script>
    <script src="modules/module7-apis.js"></script>
    <script src="modules/module8-microservices.js"></script>
    <script src="modules/module9-advanced-patterns.js"></script>
    <script src="modules/module10-observability.js"></script>
    <script src="modules/module11-real-designs.js"></script>
    <script src="courses.js"></script>
    <script src="navigation.js"></script>
    <script src="renderers.js"></script>
    <script src="interviews.js"></script>

    <!-- NO SERVICE WORKER - This version is for testing -->
    <div style="position: fixed; bottom: 10px; right: 10px; background: orange; color: black; padding: 10px; border-radius: 5px; font-size: 12px; z-index: 9999;">
        TEST MODE: No Service Worker
    </div>
</body>
</html>
